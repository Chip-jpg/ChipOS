name: Release

# Push a tag like v0.2.0 to build the APK and attach it to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename the APK
        run: cp app/build/outputs/apk/release/app-release.apk ChipOS-${{ github.ref_name }}.apk

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: ChipOS-${{ github.ref_name }}.apk
          generate_release_notes: true
